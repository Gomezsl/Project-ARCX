name: Build ARCX (arm64-v8a)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Install CMake + Ninja
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build file

      - name: Fetch third-party (ImGui, AML, stb)
        run: bash scripts/fetch_deps.sh

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-24
          -DANDROID_STL=c++_static
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j -- -k 0

      - name: Collect libs/arm64-v8a/libARCX.so
        run: |
          mkdir -p libs/arm64-v8a
          cp build/libARCX64.so libs/arm64-v8a/libARCX64.so
          file libs/arm64-v8a/libARCX64.so
          nm -D --defined-only libs/arm64-v8a/libARCX64.so | grep -E "OnModLoad|__GetModInfo" || echo "AVISO: faltan simbolos AML exportados"

      - uses: actions/upload-artifact@v4
        with:
          name: libARCX64-arm64-v8a
          path: libs/arm64-v8a/libARCX64.so
